# #1393: older runners can leak sibling capture pipes on Darwin (upstream #3553).
nextest-version = "0.9.145"

# nextest configuration.
#
# Why this exists: the integration suites in `tests/` each spawn several real
# `flock` processes over PTYs (servers, clients, ssh shims) and then wait on
# rendered frames with 30–60s deadlines. On a dev box (many cores) they have
# headroom and pass. On GitHub's small hosted runners (ubuntu ~4 vCPU, macOS
# ~3 cores) nextest's default parallelism (one test per core) runs a handful of
# these multi-process tests at once, oversubscribes the CPU, and their frame
# waits time out — flaky failures that shuffle between tests/platforms per run
# and pass in isolation. This is CPU contention, not a real regression and not
# a runner-minutes problem.
#
# Fix: serialize the worst multi-process offenders so they never compete with
# each other. Existing integration retry settings below are retained unchanged
# by #1317. New flake fixes follow CONTRIBUTING.md: condition evidence and
# producer liveness, with a measured termination ceiling only as a backstop.

[profile.default]
# #1317 backstop only: condition waits and producer liveness decide correctness.
# docs/next/nextest-timings.md: all but mesh_delivery have p99 < 42s on both legs.
slow-timeout = { period = "60s", terminate-after = 7 }

[test-groups]
# At most one of these heavy, multi-process tests runs at a time across the
# whole nextest run.
serial-pty = { max-threads = 1 }

[[profile.default.overrides]]
# Hang ceiling only (#1317): condition waits decide correctness, while a
# silent live producer must eventually produce a named test failure in CI.
# Retain the stricter 180s backstop: each binary's measured p99 is below 18s
# where observed (docs/next/nextest-timings.md).
# mesh_step2 (#1349) uses the default 420s: p99 36.409s requires >= 364.09s.
filter = 'binary(=delegate) | binary(=agent_settled) | binary(=api_ping) | binary(=cli_wrapper) | binary(=server_readiness) | binary(=live_handoff)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
# Ubuntu mesh_delivery p99 = 63.390s, requiring >= 633.90s (#1317).
# See docs/next/nextest-timings.md for runs and reproduction.
filter = 'binary(=mesh_delivery)'
slow-timeout = { period = "60s", terminate-after = 11 }

[[profile.default.overrides]]
# This end-to-end check intentionally observes the full 30-second startup grace.
filter = 'binary(delegate_verdict) & test(delegate_idle_without_new_turn_reports_not_started_and_informs_s1)'
slow-timeout = { period = "30s", terminate-after = 14 }

[[profile.default.overrides]]
# The lost-brief resubmit (#828) waits out the same 30-second startup window.
filter = 'binary(delegate_codex) & test(codex_delegate_start_resubmits_a_brief_lost_at_startup)'
slow-timeout = { period = "60s", terminate-after = 7 }

[[profile.default.overrides]]
# Acceptance must expose flakes even without a command-line retry override.
filter = 'binary(mesh_step1) | binary(mesh_step2) | binary(mesh_forwarding)'
test-group = 'serial-pty'
retries = 0

[[profile.default.overrides]]
# The federation hub/spoke and detach/reattach suites stand up multiple servers
# + clients per test and race hardest under contention — serialize them.
# live_handoff belongs here too: its live-handoff cases spawn a REPLACEMENT
# server mid-test and poll for the new pid within 10s; under parallel CPU
# contention on a small runner the replacement doesn't come up in time and the
# poll fails with "replacement server did not appear" (#129, Linux-only). It
# was previously only in the retry pool, but the contention outlasts all 3
# attempts — serializing it gives the handoff a free core.
# mcp_fleet_messaging joins them: it stands up two servers AND two `flk mcp
# serve` panes, then hands off over FIFOs whose open() blocks until the pane
# is actually running. Under contention that handshake is the first thing to
# miss its deadline, and it fails as "the MCP pane did not start" — a message
# that reads like a product bug and is not one.
# fleet_gossip also exercises multi-node restart and held-edge faults.
# mesh_step1 includes live handoff and a two-second reverse-edge assertion.
filter = 'binary(peer_federation) | binary(cross_area) | binary(live_handoff) | binary(mcp_fleet_messaging) | binary(fleet_gossip) | binary(mesh_enrollment) | binary(mesh_step1) | binary(mesh_routes)'
test-group = 'serial-pty'
retries = 2

[[profile.default.overrides]]
# The remaining integration binaries also spawn the real `flock` process; let
# them run in parallel but retry to ride out timing hiccups under CI load.
filter = 'kind(test)'
retries = 2

[profile.ci]
# Inherit the default 420s ceiling as well as every scoped ceiling (#1317).
# CI's profile (#991). It inherits every `profile.default` override above —
# the serial-pty group, the retries and the slow-timeouts — and only adds a
# JUnit report, which `scripts/ci_shards.py summary` turns into the job
# summary (slowest tests, per-binary totals, per-shard wall clock).
# Written to target/nextest/ci/junit.xml.
[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# NOTE: nextest IGNORES a top-level `[env]` table — it warns "ignoring unknown
# configuration keys: env" and carries on, so pinning the test environment here
# looks like it works and does nothing. Verified against cargo-nextest 0.9.133.
#
# Determinism therefore lives in two places that actually take effect:
#   * the justfile exports (`just test` / `just check`), and
#   * the test code itself — git is invoked with explicit `-c` overrides so a
#     developer's global/system git config cannot change the outcome (#268).
#
# The second is the one that survives a bare `cargo nextest run`.
