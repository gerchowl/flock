# nextest configuration.
#
# Why this exists: the integration suites in `tests/` each spawn several real
# `flock` processes over PTYs (servers, clients, ssh shims) and then wait on
# rendered frames with 30–60s deadlines. On a dev box (many cores) they have
# headroom and pass. On GitHub's small hosted runners (ubuntu ~4 vCPU, macOS
# ~3 cores) nextest's default parallelism (one test per core) runs a handful of
# these multi-process tests at once, oversubscribes the CPU, and their frame
# waits time out — flaky failures that shuffle between tests/platforms per run
# and pass in isolation. This is CPU contention, not a real regression and not
# a runner-minutes problem.
#
# Fix: serialize the worst multi-process offenders so they never compete with
# each other, and give every PTY-spawning integration binary a couple of
# retries to absorb residual timing flakiness. Unit tests (lib/bin) stay fully
# parallel and are not retried, so genuine logic failures still fail fast.

[test-groups]
# At most one of these heavy, multi-process tests runs at a time across the
# whole nextest run.
serial-pty = { max-threads = 1 }

[[profile.default.overrides]]
# The federation hub/spoke and detach/reattach suites stand up multiple servers
# + clients per test and race hardest under contention — serialize them.
# live_handoff belongs here too: its live-handoff cases spawn a REPLACEMENT
# server mid-test and poll for the new pid within 10s; under parallel CPU
# contention on a small runner the replacement doesn't come up in time and the
# poll fails with "replacement server did not appear" (#129, Linux-only). It
# was previously only in the retry pool, but the contention outlasts all 3
# attempts — serializing it gives the handoff a free core.
filter = 'binary(peer_federation) | binary(cross_area) | binary(live_handoff)'
test-group = 'serial-pty'
retries = 2

[[profile.default.overrides]]
# The remaining integration binaries also spawn the real `flock` process; let
# them run in parallel but retry to ride out timing hiccups under CI load.
filter = 'kind(test)'
retries = 2

# Determinism pins for the test PROCESS environment.
#
# These were previously only exported from the justfile, so they applied to
# `just test` / `just check` and to nothing else. A plain `cargo nextest run`
# — what you reach for when narrowing to one failing test — silently dropped
# them, and tests that depend on them failed in ways that look like real
# breakage. `outgoing_fleet_snapshot_from_hub_merges_relayed_cache_into_wire`
# did exactly that on a machine whose real hostname matched a fixture peer.
#
# Declaring them here makes every nextest invocation carry them, however it was
# started. The justfile keeps its own exports because they also cover
# `cargo test` and the maintenance-script suites.
[env]
# Short, deterministic hostname: sidebar layout tests derive column offsets from
# `short_host_name()`, and it must not collide with a real machine's name.
FLOCK_HOST_NAME = "host"
# `git init` defaults to `main` everywhere, regardless of the host's git config
# — the federation suite waits on an indented `:main` workspace row.
GIT_CONFIG_COUNT = "3"
GIT_CONFIG_KEY_0 = "init.defaultBranch"
GIT_CONFIG_VALUE_0 = "main"
# Commit/tag signing off: the suite runs git under a temp HOME, so a developer
# whose global config signs commits (ssh or gpg) hits "Couldn't load public key
# …: No such file or directory" and the worktree/fork tests fail — on main, for
# anyone with signing enabled. Test commits are throwaway; they need no
# provenance.
GIT_CONFIG_KEY_1 = "commit.gpgsign"
GIT_CONFIG_VALUE_1 = "false"
GIT_CONFIG_KEY_2 = "tag.gpgsign"
GIT_CONFIG_VALUE_2 = "false"
