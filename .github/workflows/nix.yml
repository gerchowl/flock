name: Nix

on:
  # No path filter on pull_request. `flake check` is a required context, and a
  # required context whose workflow is filtered out leaves the PR BLOCKED
  # forever with every reported check green. An allowlist of paths kept
  # reopening that hole for whatever it forgot -- ci.yml (#565), website/**
  # (#567), release.yml (#572) -- and the gate sweep scans every file anyway.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/nix.yml"
      # ci.yml produces two required contexts (`check (macos-15)`,
      # `check (ubuntu-latest)`), and a required context that cannot run leaves a
      # PR BLOCKED forever with every reported check green. That is not
      # hypothetical: a ci.yml-only PR cannot trigger this workflow at all,
      # because the filter named nix.yml and not ci.yml -- so the very PR that
      # raises the job budget is the one that can never be verified, and the
      # gate is silently dropped from the review of the next one.
      - ".github/workflows/ci.yml"
      - "assets/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "vendor/**"
      # The gate sweep is where scripts/*.py gates run. Filtering to build inputs
      # meant a PR touching only tests/ or docs/ never ran a gate at all — which is
      # how a hostname reached docs/next/ twice from ordinary feature commits
      # (#514, #515). guardrails-ok(nix-paths): the gate layer is the point.
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      # The released website docs are a SECOND docs tree, and a promotion onto it
      # is a docs change that docs/** does not match. So the PR that finalizes the
      # release docs -- the one that has to pass this gate before anything can be
      # cut -- could not run it. Same class as the ci.yml omission above: a
      # required gate that cannot run.
      - "website/**"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Run Nix flake check
        run: |
          nix flake check --print-build-logs
          nix flake check --all-systems --no-build --print-build-logs
