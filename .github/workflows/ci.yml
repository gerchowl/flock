# guardrails-ok(ci-shim): host-bound: cargo-nextest with zig 0.15 + macos-15 SDK constraints; follow-up tracks folding into `nix flake check` (checks.gates already covers the gates)
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
    paths-ignore:
      - "website/**"
  # Required for the merge queue. GitHub runs required checks against the
  # merge GROUP (the candidate merge commit), not the PR head — without this
  # trigger those checks never start and every queued PR waits forever.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit subjects
        if: github.event_name == 'push'
        run: python3 scripts/conventional_commits.py --range "${{ github.event.before }}..${{ github.event.after }}"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        # Through the environment, never interpolated into the script body: a
        # title is user-controlled text. Inline interpolation both allows shell
        # injection and breaks on ordinary punctuation — a title containing a
        # double quote used to fail this job for no legitimate reason.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/conventional_commits.py "$PR_TITLE"

      # On `merge_group` neither step above runs: a merge group has no PR title
      # and no before/after range. That is intentional — the title was already
      # validated when the PR ran, and the squash subject is taken from it. The
      # job still reports success so it can stay a required context, which the
      # queue needs in order to gate on it.

  # One platform each, split into lint, build and parallel test-shard jobs
  # (ci-leg.yml, #991). Each OS is its own reusable-workflow call so its
  # result can be judged alone in the check jobs below.
  ubuntu:
    name: ubuntu-latest
    uses: ./.github/workflows/ci-leg.yml
    with:
      leg: ubuntu-latest

  # Pinned to macos-15, NOT macos-latest: GitHub rotated macos-latest to the
  # macOS 26 ("Tahoe") image, whose SDK the vendored libghostty-vt zig 0.15.2
  # build can't link against (undefined libSystem symbols like
  # __availability_version_check). macos-15 is the last image this toolchain
  # builds on. Revisit when zig gains macOS 26 SDK support.
  macos:
    name: macos-15
    uses: ./.github/workflows/ci-leg.yml
    with:
      leg: macos-15
      # Batch PRs use head_ref; ref is refs/pull/<number>/merge on PR events.
      run-tests: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'land/') }}

  # The required checks. Branch protection and the landing driver wait on
  # exactly `check (macos-15)` and `check (ubuntu-latest)`, so these keep the
  # names of the single job they replace, and pass only when every job of
  # their leg passed. `always()` rather than `!cancelled()`: a skipped
  # required check counts as passing, so a leg that was cancelled, timed out
  # or never started must still run this job and turn it red.
  check-ubuntu:
    name: check (ubuntu-latest)
    needs: ubuntu
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download JUnit reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: junit-ubuntu-latest-*
          path: junit

      - name: Summarize shards
        run: python3 scripts/ci_shards.py summary --title 'check (ubuntu-latest)' --strip-prefix junit-ubuntu-latest- junit >> "$GITHUB_STEP_SUMMARY"

      - name: Require every job of the leg
        if: always()
        env:
          RESULT: ${{ needs.ubuntu.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "ubuntu-latest leg ended as $RESULT" >&2
            exit 1
          fi

  check-macos:
    name: check (macos-15)
    needs: macos
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download JUnit reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: junit-macos-15-*
          path: junit

      - name: Summarize shards
        run: python3 scripts/ci_shards.py summary --title 'check (macos-15)' --strip-prefix junit-macos-15- junit >> "$GITHUB_STEP_SUMMARY"

      - name: Require every job of the leg
        if: always()
        env:
          RESULT: ${{ needs.macos.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "macos-15 leg ended as $RESULT" >&2
            exit 1
          fi
