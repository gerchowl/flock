# guardrails-ok(ci-shim): host-bound: cargo-nextest with zig 0.15 + macos-15 SDK constraints; follow-up tracks folding into `nix flake check` (checks.gates already covers the gates)
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
    paths-ignore:
      - "website/**"
  # Required for the merge queue. GitHub runs required checks against the
  # merge GROUP (the candidate merge commit), not the PR head — without this
  # trigger those checks never start and every queued PR waits forever.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit subjects
        if: github.event_name == 'push'
        run: python3 scripts/conventional_commits.py --range "${{ github.event.before }}..${{ github.event.after }}"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        # Through the environment, never interpolated into the script body: a
        # title is user-controlled text. Inline interpolation both allows shell
        # injection and breaks on ordinary punctuation — a title containing a
        # double quote used to fail this job for no legitimate reason.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/conventional_commits.py "$PR_TITLE"

      # On `merge_group` neither step above runs: a merge group has no PR title
      # and no before/after range. That is intentional — the title was already
      # validated when the PR ran, and the squash subject is taken from it. The
      # job still reports success so it can stay a required context, which the
      # queue needs in order to gate on it.

  # Fail-safe change detection (scripts/ci_changes.py). Only an ordinary
  # pull_request touching nothing but docs/website/markdown or the web client
  # may skip the Rust legs; any other path, a `land/` batch head, merge_group,
  # push, or a detection failure leaves `skip_rust` != 'true' and runs
  # everything. The check jobs below still report either way.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_rust: ${{ steps.decide.outputs.skip_rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "skip_rust=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          python3 scripts/ci_changes.py "$EVENT" "$HEAD_REF" < changed.txt >> "$GITHUB_OUTPUT"

  # Maintenance-script tests and the platform test-gap ratchet (#597). Some of
  # them read docs/website/README files, so they run on EVERY event, outside
  # the skippable Rust legs, and `check (ubuntu-latest)` requires them.
  script-tests:
    name: script-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/dev' }}
          gc-max-store-size-linux: 2G
          gc-max-store-size-macos: 2G

      - name: Run maintenance script tests
        run: nix develop -c just script-tests

  # One platform each, split into lint, build and parallel test-shard jobs
  # (ci-leg.yml, #991). Each OS is its own reusable-workflow call so its
  # result can be judged alone in the check jobs below.
  ubuntu:
    name: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip_rust != 'true' }}
    uses: ./.github/workflows/ci-leg.yml
    with:
      leg: ubuntu-latest

  # The web client (ADR-0038 G1): lockfile install, bun tests, the fixture
  # screenshots, the strict type check and the Vite build. One platform is
  # enough: the bundle is static assets. It reports as its own `client` check.
  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: just

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install Chromium for the screenshot test
        run: just client-browsers

      - name: Client check
        run: just client-check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-screenshots
          path: web/client/artifacts/screenshots/
          if-no-files-found: error

  # Pinned to macos-15, NOT macos-latest: GitHub rotated macos-latest to the
  # macOS 26 ("Tahoe") image, whose SDK the vendored libghostty-vt zig 0.15.2
  # build can't link against (undefined libSystem symbols like
  # __availability_version_check). macos-15 is the last image this toolchain
  # builds on. Revisit when zig gains macOS 26 SDK support.
  macos:
    name: macos-15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip_rust != 'true' }}
    uses: ./.github/workflows/ci-leg.yml
    with:
      leg: macos-15
      # Policy (#1613, docs/next/ci-platform-policy.md): ordinary PRs run macOS
      # build + lint only; the full macOS test matrix runs for `land/` batch
      # PRs, merge_group and pushes. check-macos below asserts this expectation.
      # Batch PRs use head_ref; ref is refs/pull/<number>/merge on PR events.
      run-tests: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'land/') }}

  # The required checks. Branch protection and the landing driver wait on
  # exactly `check (macos-15)` and `check (ubuntu-latest)`, so these keep the
  # names of the single job they replace, and pass only when every job of
  # their leg passed. `always()` is required: branch protection treats a
  # skipped required check as passing. Cancelled, failed or skipped legs must
  # run the result gate and fail explicitly, rather than permit an untested merge.
  check-ubuntu:
    name: check (ubuntu-latest)
    needs: [changes, ubuntu, script-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download JUnit reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: junit-ubuntu-latest-*
          path: junit

      - name: Summarize shards
        continue-on-error: true
        run: python3 scripts/ci_shards.py summary --title 'check (ubuntu-latest)' --strip-prefix junit-ubuntu-latest- junit >> "$GITHUB_STEP_SUMMARY"

      - name: Require the maintenance script tests
        if: always()
        env:
          SCRIPT_TESTS: ${{ needs.script-tests.result }}
        run: |
          if [ "$SCRIPT_TESTS" != success ]; then
            echo "script-tests ended as $SCRIPT_TESTS" >&2
            exit 1
          fi

      - name: Require every job of the leg
        if: always()
        env:
          RESULT: ${{ needs.ubuntu.result }}
          SKIP_RUST: ${{ needs.changes.outputs.skip_rust }}
        run: |
          # `skipped` is acceptable only when change detection succeeded and
          # chose to skip (docs/web-only PR); every other state fails.
          if [ "$RESULT" = skipped ] && [ "$SKIP_RUST" = true ]; then
            echo "ubuntu-latest leg skipped: docs/web-only change"
            exit 0
          fi
          if [ "$RESULT" != success ]; then
            echo "ubuntu-latest leg ended as $RESULT" >&2
            exit 1
          fi

  check-macos:
    name: check (macos-15)
    needs: [changes, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download JUnit reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: junit-macos-15-*
          path: junit

      - name: Summarize shards
        continue-on-error: true
        run: python3 scripts/ci_shards.py summary --title 'check (macos-15)' --strip-prefix junit-macos-15- junit >> "$GITHUB_STEP_SUMMARY"

      - name: Require every job of the leg
        if: always()
        env:
          RESULT: ${{ needs.macos.result }}
          SKIP_RUST: ${{ needs.changes.outputs.skip_rust }}
        run: |
          # `skipped` is acceptable only when change detection succeeded and
          # chose to skip (docs/web-only PR); every other state fails.
          if [ "$RESULT" = skipped ] && [ "$SKIP_RUST" = true ]; then
            echo "macos-15 leg skipped: docs/web-only change"
            exit 0
          fi
          if [ "$RESULT" != success ]; then
            echo "macos-15 leg ended as $RESULT" >&2
            exit 1
          fi

      # A skipped test job counts as success for the leg, so on full-matrix
      # events (batch PRs, merge_group, push) prove the shards really ran:
      # one JUnit report per shard the build planned.
      - name: Require the expected test shards when the full matrix is due
        if: always()
        env:
          FULL: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'land/') }}
          SHARDS: ${{ needs.macos.outputs.shards }}
        run: |
          [ "$FULL" = true ] || exit 0
          expected="$(python3 -c 'import json,os; print(len(json.loads(os.environ["SHARDS"] or "[]")))')"
          actual="$(find junit -name junit.xml 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$expected" -lt 1 ] || [ "$actual" != "$expected" ]; then
            echo "full macOS matrix due: expected $expected shard reports, found $actual" >&2
            exit 1
          fi
