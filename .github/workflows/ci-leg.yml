# guardrails-ok(ci-shim): host-bound build/test legs of ci.yml use zig 0.15 + macos-15 SDK constraints; lint runs in the dev shell through `just` recipes
name: CI leg

# One platform's test run, split across parallel jobs (#991). ci.yml calls this
# once per platform and reports `check (<leg>)` from the result, so a red
# shard on one platform never fails the other platform's required check.
#
#   lint    fmt, clippy and rustdoc, from the start, alongside build
#   build   compile every test binary once into a nextest archive, and fail
#           unless the shards partition the leg's tests exactly
#   test    one job per shard of .config/ci-shards.toml: the serial ones
#           run their serial-pty binaries one at a time, as the single job
#           used to, and the others run everything else in parallel
#
# Shards run the archive rather than rebuilding, which is what makes a shard
# cost minutes of tests and not minutes of compile.

on:
  workflow_call:
    inputs:
      leg:
        description: Runner image, and the leg's key in .config/ci-shards.toml
        required: true
        type: string
      run-tests:
        description: Run test shards; ordinary macOS PRs build and lint only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ${{ inputs.leg }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/dev' }}
          gc-max-store-size-linux: 2G
          gc-max-store-size-macos: 2G

      - name: Lint in the dev shell
        run: nix develop -c just lint

      - name: Check Rust documentation
        run: nix develop -c just doc-check

      # Maintenance-script tests and the platform test-gap ratchet (#597).
      - name: Run maintenance script tests
        if: runner.os == 'Linux'
        run: nix develop -c just script-tests

  build:
    name: build
    runs-on: ${{ inputs.leg }}
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.archive.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read nextest version
        id: nextest-version
        shell: bash
        run: |
          version="$(python3 scripts/nextest_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: just,cargo-nextest@${{ steps.nextest-version.outputs.version }}

      # Pinned to 0.15.2, and the macOS leg to macos-15 rather than
      # macos-latest: the vendored libghostty-vt zig build cannot link against
      # the macOS 26 SDK (see ci.yml).
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      # setup-zig's own cache adds a run ID. Reuse its directory and old
      # dev entries, but save only one key per compiler/source generation.
      - name: Restore Zig build cache
        id: zig-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.zig-cache
          key: setup-zig-cache-v2-${{ github.job }}-zig-${{ runner.arch == 'X64' && 'x86_64' || 'aarch64' }}-${{ runner.os == 'Linux' && 'linux' || 'macos' }}-0.15.2--dev-${{ hashFiles('vendor/libghostty-vt/**', 'build.rs') }}
          restore-keys: setup-zig-cache-v2-${{ github.job }}-zig-${{ runner.arch == 'X64' && 'x86_64' || 'aarch64' }}-${{ runner.os == 'Linux' && 'linux' || 'macos' }}-0.15.2--

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-bin: false

      - name: Build test archive and verify the shard partition
        id: archive
        run: just ci-archive '${{ inputs.leg }}' nextest-archive.tar.zst

      - name: Save Zig build cache from dev
        if: github.ref == 'refs/heads/dev' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      - name: Upload test archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive-${{ inputs.leg }}
          path: nextest-archive.tar.zst
          retention-days: 1
          # Already zstd.
          compression-level: 0

  test:
    # Job conditions run before matrix expansion, so false schedules no shards.
    if: ${{ inputs.run-tests }}
    name: ${{ matrix.shard.name }} (${{ matrix.shard.label }})
    needs: build
    runs-on: ${{ inputs.leg }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No toolchain, zig or cache: nothing is compiled here. The runner
      # image's cargo only dispatches to cargo-nextest, and the archive
      # carries its own standard library.
      - name: Read nextest version
        id: nextest-version
        shell: bash
        run: |
          version="$(python3 scripts/nextest_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: just,cargo-nextest@${{ steps.nextest-version.outputs.version }}

      - name: Download test archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive-${{ inputs.leg }}

      - name: Run shard
        run: just ci-shard '${{ inputs.leg }}' '${{ matrix.shard.name }}' nextest-archive.tar.zst

      - name: Summarize
        continue-on-error: true
        if: always()
        run: python3 scripts/ci_shards.py summary --title '${{ matrix.shard.name }} (${{ inputs.leg }})' '${{ matrix.shard.name }}=target/nextest/ci/junit.xml' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ inputs.leg }}-${{ matrix.shard.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          overwrite: true
