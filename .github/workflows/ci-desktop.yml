name: CI desktop

# The Tauri desktop shell's tests (desktop/, #1601; the capability manifest,
# CSP, navigation lock, DevTools and entitlements hardening, the bridge, mint
# and config). ci.yml calls this once per platform and reports each result
# through `check (<leg>)`, so a red shell on one OS fails that OS's required
# check only.
#
# The shell is its own crate outside flk's workspace (own Cargo.lock/target),
# so it neither shares nor needs the zig/libghostty toolchain of ci-leg.yml.
# `tauri::generate_context!` reads `frontendDist` (../web/client/dist) at
# compile time, so the client is built first, as the `client` job builds it.
# Signing, notarisation and the nix build of the shell are G9c (#1636).

on:
  workflow_call:
    inputs:
      leg:
        description: Runner image
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ inputs.leg }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tauri v2's Linux prerequisites (WebKitGTK 4.1 and its companions).
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: just

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-bin: false

      - name: Desktop shell tests
        run: just desktop-test
